# Fast checks for the 3Dmach Python code: parser and tooling tests with plain pytest, and the
# headless add-on tests against an official Blender 5.2 LTS build (no fork build needed).
name: Tests

on:
  push:
    branches: ["mx/**"]
  pull_request:
  workflow_dispatch:

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pylibs
            tests
            scripts/addons_core
            scripts/modules/mx_common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: maxfile
        run: cd pylibs/maxfile && python -m pytest -q
      - name: corpus tooling
        run: python -m pytest -q tests/corpus
      - name: primitives geometry
        run: python -m pytest -q tests/primitives
      - name: importer helpers
        run: python -m pytest -q tests/importer

  blender:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pylibs
            tests
            scripts/addons_core
            scripts/modules/mx_common
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libvulkan1
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender && cd ~/blender
          curl -sfL -o b.tar.xz "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  b.tar.xz" | sha256sum -c
          tar xf b.tar.xz --strip-components=1 && rm b.tar.xz
      - name: Headless Blender tests
        run: python3 tests/blender/run_tests.py --blender ~/blender/blender
